<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket Demo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#080b16;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:92%;
  max-width:430px;
  margin:auto;
  padding:20px 0 35px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:900;
}

.demo{
  padding:6px 10px;
  border-radius:12px;
  background:#242a42;
  color:#91a2ff;
  font-size:11px;
  font-weight:bold;
}

.balance{
  margin-top:15px;
  padding:15px;
  background:#141a2b;
  border-radius:18px;
  text-align:center;
}

.balance span{
  color:#55aaff;
  font-size:25px;
  font-weight:800;
}

.game{
  position:relative;
  height:390px;
  margin-top:15px;
  overflow:hidden;
  border-radius:25px;
  background:
    radial-gradient(circle at 50% 45%,
    #30477d 0%,
    #151d35 45%,
    #080b16 82%);
}

.multiplier{
  position:absolute;
  top:70px;
  width:100%;
  text-align:center;
  font-size:50px;
  font-weight:900;
}

.rocket{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  font-size:68px;
  transition:bottom .08s linear;
}

.flame{
  position:absolute;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  font-size:30px;
}

.status{
  text-align:center;
  margin:12px 0;
  color:#aeb8d0;
}

.panel{
  margin-top:15px;
  padding:17px;
  background:#141a2b;
  border-radius:18px;
}

input,select{
  width:100%;
  margin-top:9px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#252c45;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.claim{
  background:#20a866;
}

.admin{
  display:none;
}

.result{
  text-align:center;
  margin-top:12px;
  color:#8affb0;
  font-weight:bold;
}

.small{
  color:#9ba6c3;
  font-size:13px;
  line-height:1.5;
}

.history{
  margin-top:15px;
  padding:15px;
  background:#141a2b;
  border-radius:18px;
}

.history span{
  display:inline-block;
  margin:4px;
  padding:7px 9px;
  border-radius:9px;
  background:#252c45;
  color:#9eafff;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🚀 Rocket</div>
    <div class="demo">DEMO MODE</div>
  </div>

  <div class="balance">
    Demo Balance<br>
    <span id="balance">1000 Points</span>
  </div>

  <div class="game">

    <div class="multiplier" id="multiplier">
      1.00x
    </div>

    <div class="rocket" id="rocket">
      🚀
    </div>

    <div class="flame" id="flame">
      🔥
    </div>

  </div>

  <div class="status" id="status">
    🚀 Starting next round...
  </div>

  <div class="panel">

    <b>🎮 Demo Amount</b>

    <input
      id="amount"
      type="number"
      min="1"
      placeholder="Enter Demo Points"
    >

    <button
      id="joinButton"
      onclick="joinRound()">
      🚀 START DEMO
    </button>

    <button
      id="claimButton"
      class="claim"
      onclick="claimReward()"
      disabled>
      💰 CLAIM
    </button>

    <div
      class="result"
      id="result">
    </div>

  </div>

  <div class="history">
    <b>📊 Recent Rounds</b>
    <div id="history"></div>
  </div>

  <button onclick="toggleAdmin()">
    👑 Admin Demo Panel
  </button>

  <div class="panel admin" id="admin">

    <h2>👑 Admin Panel</h2>

    <div class="small">
      Demo-only settings.
    </div>

    <select id="mode">

      <option value="random">
        Random Demo Crash
      </option>

      <option value="fixed">
        Fixed Demo Crash
      </option>

    </select>

    <input
      id="fixedCrash"
      type="number"
      min="2"
      max="300"
      value="20"
      placeholder="Example: 20"
    >

    <button onclick="saveAdmin()">
      💾 SAVE SETTINGS
    </button>

    <p id="adminStatus"></p></div>

</div>

<script>

let balance = 1000;

let running = false;
let joined = false;
let claimed = false;

let amount = 0;
let multiplier = 1;
let crashPoint = 20;

let mode = "random";

let startTime = 0;
let frame = null;


/* -------------------------
   BALANCE
------------------------- */

function updateBalance(){

  document.getElementById("balance")
    .innerText =
    Math.floor(balance) +
    " Points";
}


/* -------------------------
   RANDOM CRASH
------------------------- */

function randomCrash(){

  return Number(
    (2 + Math.random() * 298)
      .toFixed(2)
  );
}


/* -------------------------
   CRASH POINT
------------------------- */

function getCrashPoint(){

  if(mode === "fixed"){

    return Math.max(
      2,
      Math.min(
        300,
        Number(
          document.getElementById(
            "fixedCrash"
          ).value
        )
      )
    );
  }

  return randomCrash();
}


/* -------------------------
   START ROUND
------------------------- */

function startRound(){

  running = true;

  joined = false;
  claimed = false;

  amount = 0;

  multiplier = 1;

  crashPoint =
    getCrashPoint();

  startTime =
    performance.now();

  document.getElementById(
    "multiplier"
  ).innerText = "1.00x";

  document.getElementById(
    "status"
  ).innerText =
    "🚀 Rocket is flying...";

  document.getElementById(
    "result"
  ).innerText = "";

  document.getElementById(
    "claimButton"
  ).disabled = true;

  document.getElementById(
    "joinButton"
  ).disabled = false;

  frame =
    requestAnimationFrame(run);
}


/* -------------------------
   ROCKET
------------------------- */

function run(now){

  if(!running) return;

  const elapsed =
    (now - startTime) / 1000;


  /*
    Slower multiplier.
  */

  multiplier =
    1 + elapsed * 0.35;


  if(multiplier >= crashPoint){

    multiplier =
      crashPoint;

    crash();

    return;
  }


  document.getElementById(
    "multiplier"
  ).innerText =
    multiplier.toFixed(2) +
    "x";


  /*
    Rocket slowly moves upward.
  */

  const progress =
    Math.min(
      1,
      (multiplier - 1) /
      Math.max(
        1,
        crashPoint - 1
      )
    );


  const height =
    35 + progress * 280;


  document.getElementById(
    "rocket"
  ).style.bottom =
    height + "px";


  document.getElementById(
    "flame"
  ).style.bottom =
    (height - 18) + "px";


  frame =
    requestAnimationFrame(run);
}


/* -------------------------
   JOIN
------------------------- */

function joinRound(){

  if(!running){

    alert(
      "Wait for the next round."
    );

    return;
  }


  if(joined){

    alert(
      "You already joined."
    );

    return;
  }


  const value =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  if(!value || value <= 0){

    alert(
      "Enter Demo Points."
    );

    return;
  }


  if(value > balance){

    alert(
      "Not enough Demo Points."
    );

    return;
  }


  amount = value;

  balance -= amount;

  updateBalance();

  joined = true;

  document.getElementById(
    "joinButton"
  ).disabled = true;

  document.getElementById(
    "claimButton"
  ).disabled = false;

  document.getElementById(
    "result"
  ).innerText =
    "✅ Demo round joined";
}


/* -------------------------
   CLAIM
------------------------- */

function claimReward(){

  if(!running || !joined){

    return;
  }


  if(claimed){

    return;
  }


  claimed = true;


  /*
    Demo calculation only.
  */

  const reward =
    Math.floor(
      amount * multiplier
    );


  balance += reward;

  updateBalance();


  document.getElementById(
    "claimButton"
  ).disabled = true;


  document.getElementById(
    "result"
  ).innerText =
    "🎉 Claimed " +
    reward +
    " Demo Points at " +
    multiplier.toFixed(2) +
    "x";
}


/* -------------------------
   CRASH
------------------------- */

function crash(){

  running = false;

  if(frame){

    cancelAnimationFrame(
      frame
    );

    frame = null;
  }document.getElementById(
    "multiplier"
  ).innerText =
    crashPoint.toFixed(2) +
    "x";


  document.getElementById(
    "status"
  ).innerText =
    "💥 CRASH " +
    crashPoint.toFixed(2) +
    "x";


  document.getElementById(
    "claimButton"
  ).disabled = true;


  if(joined && !claimed){

    document.getElementById(
      "result"
    ).innerText =
      "💥 Crash! Demo round ended.";
  }


  addHistory(
    crashPoint
  );


  /*
    AUTO NEXT ROUND
  */

  setTimeout(() => {

    document.getElementById(
      "rocket"
    ).style.bottom =
      "35px";

    document.getElementById(
      "flame"
    ).style.bottom =
      "15px";

    document.getElementById(
      "status"
    ).innerText =
      "🚀 Next round...";


    setTimeout(
      startRound,
      1500
    );

  },2500);
}


/* -------------------------
   HISTORY
------------------------- */

function addHistory(value){

  const item =
    document.createElement(
      "span"
    );

  item.innerText =
    value.toFixed(2) +
    "x";

  document.getElementById(
    "history"
  ).prepend(item);


  const list =
    document.getElementById(
      "history"
    );


  while(
    list.children.length > 8
  ){

    list.removeChild(
      list.lastChild
    );
  }
}


/* -------------------------
   ADMIN
------------------------- */

function toggleAdmin(){

  const panel =
    document.getElementById(
      "admin"
    );


  panel.style.display =
    panel.style.display ===
    "block"
      ? "none"
      : "block";
}


function saveAdmin(){

  mode =
    document.getElementById(
      "mode"
    ).value;


  if(mode === "fixed"){

    const value =
      Number(
        document.getElementById(
          "fixedCrash"
        ).value
      );


    if(
      !value ||
      value < 2 ||
      value > 300
    ){

      alert(
        "Use 2x - 300x."
      );

      return;
    }
  }


  document.getElementById(
    "adminStatus"
  ).innerText =
    mode === "random"
      ? "✅ Random Demo mode saved."
      : "✅ Fixed Demo mode saved.";
}


/* -------------------------
   START AUTOMATICALLY
------------------------- */

updateBalance();

setTimeout(
  startRound,
  1000
);

</script>

</body>
</html>
