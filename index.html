<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket Demo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#070a15;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:92%;
  max-width:430px;
  margin:auto;
  padding:20px 0 35px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:900;
}

.badge{
  background:#242a43;
  color:#91a0ff;
  padding:6px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:bold;
}

.balance{
  margin-top:15px;
  padding:15px;
  background:#141a2c;
  border-radius:18px;
  text-align:center;
}

.balance span{
  color:#55aaff;
  font-size:25px;
  font-weight:bold;
}

.game{
  position:relative;
  height:370px;
  margin-top:15px;
  overflow:hidden;
  border-radius:25px;
  background:
    radial-gradient(circle at 50% 45%,
    #293b6e 0%,
    #121a31 48%,
    #070a15 80%);
}

.multiplier{
  position:absolute;
  top:75px;
  width:100%;
  text-align:center;
  font-size:52px;
  font-weight:900;
  z-index:2;
}

.rocket{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  font-size:70px;
  transition:bottom .08s linear;
  z-index:3;
}

.status{
  text-align:center;
  margin:12px 0;
  color:#aeb8d5;
}

.panel{
  margin-top:15px;
  padding:17px;
  border-radius:18px;
  background:#141a2c;
}

input{
  width:100%;
  margin-top:9px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#252c46;
  color:white;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

.admin{
  display:none;
}

.result{
  margin-top:10px;
  color:#8affb0;
  font-weight:bold;
  text-align:center;
}

.small{
  color:#99a4c2;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🚀 Rocket</div>
    <div class="badge">DEMO MODE</div>
  </div>

  <div class="balance">
    Demo Balance<br>
    <span id="balance">1000 Points</span>
  </div>

  <div class="game">

    <div class="multiplier" id="multiplier">
      1.00x
    </div>

    <div class="rocket" id="rocket">
      🚀
    </div>

  </div>

  <div class="status" id="status">
    Starting next round...
  </div>

  <div class="panel">

    <b>🎮 Demo Points</b>

    <input
      id="amount"
      type="number"
      min="1"
      placeholder="Enter demo points"
    >

    <button onclick="joinRound()">
      🎮 JOIN CURRENT ROUND
    </button>

    <div class="result" id="result"></div>

  </div>

  <button onclick="toggleAdmin()">
    👑 Admin Demo Panel
  </button>

  <div class="panel admin" id="admin">

    <h2>👑 Admin Panel</h2>

    <div class="small">
      Choose the demo crash mode.
      This is only a local demo setting.
    </div>

    <label>
      Crash Mode
      <select id="mode"
        style="
        width:100%;
        margin-top:9px;
        padding:14px;
        border:0;
        border-radius:12px;
        background:#252c46;
        color:white;
        font-size:16px;">
        <option value="random">Random 1x - 300x</option>
        <option value="fixed">Fixed Multiplier</option>
      </select>
    </label>

    <input
      id="fixedCrash"
      type="number"
      min="1"
      max="300"
      value="20"
      placeholder="Example: 20"
    >

    <button onclick="saveAdminSettings()">
      💾 SAVE SETTINGS
    </button>

    <p id="adminStatus"></p>

  </div>

</div>

<script>

let balance = 1000;

let roundRunning = false;
let joinedAmount = 0;

let crashMode = "random";
let fixedCrash = 20;

let crashPoint = 2;
let multiplier = 1;

let startTime = 0;
let animationFrame = null;

const ROUND_DELAY = 3000;

function updateBalance(){

  document.getElementById("balance")
    .innerText =
    Math.floor(balance) + " Points";
}function randomCrashPoint(){

  /*
    Demo random crash point:
    1x - 300x
  */

  return Number(
    (1 + Math.random() * 299).toFixed(2)
  );
}

function getCrashPoint(){

  if(crashMode === "fixed"){
    return Math.min(
      300,
      Math.max(1, fixedCrash)
    );
  }

  return randomCrashPoint();
}

function startRound(){

  if(roundRunning) return;

  roundRunning = true;

  multiplier = 1;

  crashPoint = getCrashPoint();

  startTime = performance.now();

  document.getElementById("status")
    .innerText =
    "🚀 Rocket is flying...";

  document.getElementById("result")
    .innerText = "";

  animateRocket();
}

function animateRocket(){

  if(!roundRunning) return;

  const now = performance.now();

  const elapsed =
    (now - startTime) / 1000;

  /*
    Demo speed:
    approximately 1x -> crash point
  */

  multiplier =
    1 + elapsed * 1.5;

  if(multiplier >= crashPoint){

    multiplier = crashPoint;

    finishRound();

    return;
  }

  document.getElementById("multiplier")
    .innerText =
    multiplier.toFixed(2) + "x";

  /*
    Rocket movement
  */

  const progress =
    Math.min(
      1,
      (multiplier - 1) /
      Math.max(1, crashPoint - 1)
    );

  const bottom =
    35 + progress * 260;

  document.getElementById("rocket")
    .style.bottom =
    bottom + "px";

  animationFrame =
    requestAnimationFrame(animateRocket);
}

function finishRound(){

  roundRunning = false;

  if(animationFrame){
    cancelAnimationFrame(animationFrame);
  }

  document.getElementById("multiplier")
    .innerText =
    crashPoint.toFixed(2) + "x";

  document.getElementById("status")
    .innerText =
    "💥 Round finished at " +
    crashPoint.toFixed(2) +
    "x";

  /*
    Demo only.
    If user joined the round,
    show a simulated result.
  */

  if(joinedAmount > 0){

    const demoResult =
      Math.floor(
        joinedAmount * crashPoint
      );

    balance += demoResult;

    updateBalance();

    document.getElementById("result")
      .innerText =
      "🎉 Demo result: +" +
      demoResult +
      " Points";

    joinedAmount = 0;
  }

  setTimeout(resetRound, ROUND_DELAY);
}

function resetRound(){

  document.getElementById("multiplier")
    .innerText =
    "1.00x";

  document.getElementById("rocket")
    .style.bottom =
    "35px";

  document.getElementById("status")
    .innerText =
    "🚀 New round starting...";

  setTimeout(startRound, 1200);
}

function joinRound(){

  if(!roundRunning){

    alert(
      "Please wait for the next round."
    );

    return;
  }

  if(joinedAmount > 0){

    alert(
      "You already joined this round."
    );

    return;
  }

  const amount =
    Number(
      document.getElementById("amount").value
    );

  if(!amount || amount <= 0){

    alert(
      "Enter a demo amount."
    );

    return;
  }

  if(amount > balance){

    alert(
      "Not enough demo points."
    );

    return;
  }

  balance -= amount;

  joinedAmount = amount;

  updateBalance();

  document.getElementById("result")
    .innerText =
    "✅ Joined current demo round";

}

function toggleAdmin(){

  const panel =
    document.getElementById("admin");

  panel.style.display =
    panel.style.display === "block"
    ? "none"
    : "block";
}

function saveAdminSettings(){

  const mode =
    document.getElementById("mode").value;

  const value =
    Number(
      document.getElementById("fixedCrash").value
    );

  crashMode = mode;

  if(mode === "fixed"){

    if(!value  value < 1  value > 300){

      alert(
        "Fixed multiplier must be 1x - 300x."
      );

      return;
    }

    fixedCrash = value;
  }

  document.getElementById("adminStatus")
    .innerText =
    mode === "random"
    ? "✅ Random 1x - 300x enabled."
    : "✅ Fixed crash set to " +
      fixedCrash.toFixed(2) + "x";
}

updateBalance();

/*
  AUTO START
*/

setTimeout(startRound, 1500);

</script>

</body>
</html>
