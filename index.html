<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080b18;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 92%;
  max-width: 430px;
  margin: auto;
  padding: 25px 0;
  text-align: center;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.badge {
  background: #252b45;
  color: #8ea2ff;
  padding: 6px 10px;
  border-radius: 12px;
  font-size: 12px;
}

.balance {
  margin-top: 20px;
  padding: 15px;
  border-radius: 18px;
  background: #141a2d;
}

.balance span {
  color: #55aaff;
  font-size: 25px;
  font-weight: bold;
}

.game {
  height: 360px;
  margin-top: 18px;
  border-radius: 25px;
  background:
    radial-gradient(circle at center, #263866 0%, #11182d 45%, #080b18 75%);
  position: relative;
  overflow: hidden;
}

.rocket {
  position: absolute;
  left: 50%;
  bottom: 45px;
  transform: translateX(-50%);
  font-size: 70px;
  transition: bottom .15s linear;
}

.multiplier {
  position: absolute;
  top: 105px;
  width: 100%;
  font-size: 48px;
  font-weight: 900;
}

.status {
  margin-top: 12px;
  color: #aab4d0;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  border: none;
  border-radius: 15px;
  background: #5865f2;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:active {
  transform: scale(.97);
}

.admin {
  display: none;
  margin-top: 20px;
  padding: 20px;
  border-radius: 20px;
  background: #151b30;
  text-align: left;
}

.admin h2 {
  margin-top: 0;
}

.admin button {
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🚀 Rocket</div>
    <div class="badge">DEMO MODE</div>
  </div>

  <div class="balance">
    Demo Balance<br>
    <span id="balance">100.00 TON</span>
  </div>

  <div class="game">

    <div class="multiplier" id="multiplier">
      1.00x
    </div>

    <div class="rocket" id="rocket">
      🚀
    </div>

  </div>

  <div class="status" id="status">
    Ready to start
  </div>

  <button id="startButton" onclick="startRocket()">
    🚀 START DEMO
  </button>

  <button onclick="showAdmin()">
    👑 Admin Demo
  </button>

  <div class="admin" id="adminPanel">

    <h2>👑 Admin Panel</h2>

    <p>Demo Controls</p>

    <button onclick="addBalance()">
      + Add 10 TON
    </button>

    <button onclick="resetBalance()">
      Reset Balance
    </button>

    <button onclick="closeAdmin()">
      Close Admin
    </button>

  </div>

</div>

<script>

let balance = 100;
let running = false;

function startRocket() {

  if (running) return;

  running = true;

  let multiplier = 1.00;
  let rocketHeight = 45;

  document.getElementById("status").innerText =
    "Rocket is flying...";

  document.getElementById("startButton").disabled = true;

  const timer = setInterval(() => {

    multiplier += 0.05;

    rocketHeight += 2;

    document.getElementById("multiplier").innerText =
      multiplier.toFixed(2) + "x";

    document.getElementById("rocket").style.bottom =
      rocketHeight + "px";

    // Demo crash point
    if (multiplier >= 3.00) {

      clearInterval(timer);

      document.getElementById("status").innerText =
        "💥 Demo Rocket Finished!";

      running = false;

      document.getElementById("startButton").disabled = false;

      setTimeout(resetRocket, 2000);
    }

  }, 120);

}

function resetRocket() {

  document.getElementById("multiplier").innerText =
    "1.00x";

  document.getElementById("rocket").style.bottom =
    "45px";

  document.getElementById("status").innerText =
    "Ready to start";
}

function showAdmin() {
  document.getElementById("adminPanel").style.display =
    "block";
}

function closeAdmin() {
  document.getElementById("adminPanel").style.display =
    "none";
}

function addBalance() {

  balance += 10;document.getElementById("balance").innerText =
    balance.toFixed(2) + " TON";
}

function resetBalance() {

  balance = 100;

  document.getElementById("balance").innerText =
    balance.toFixed(2) + " TON";
}

</script>

</body>
</html>
