<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #070a15;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 92%;
  max-width: 430px;
  margin: auto;
  padding: 20px 0 40px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 27px;
  font-weight: 900;
}

.badge {
  background: #252b45;
  color: #8ea0ff;
  padding: 7px 11px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
}

.balance {
  margin-top: 16px;
  padding: 16px;
  background: #141a2c;
  border-radius: 18px;
  text-align: center;
}

.balance span {
  color: #55aaff;
  font-size: 25px;
  font-weight: bold;
}

.game {
  position: relative;
  height: 380px;
  margin-top: 16px;
  overflow: hidden;
  border-radius: 25px;

  background:
    radial-gradient(
      circle at 50% 45%,
      #30477f 0%,
      #151e38 45%,
      #070a15 80%
    );
}

.multiplier {
  position: absolute;
  top: 70px;
  width: 100%;
  text-align: center;
  font-size: 52px;
  font-weight: 900;
  z-index: 2;
}

.rocket {
  position: absolute;
  left: 50%;
  bottom: 35px;
  transform: translateX(-50%);
  font-size: 72px;
  z-index: 3;
}

.flame {
  position: absolute;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  font-size: 35px;
  z-index: 2;
}

.status {
  margin: 13px 0;
  text-align: center;
  color: #aeb8d5;
}

.panel {
  margin-top: 15px;
  padding: 18px;
  background: #141a2c;
  border-radius: 18px;
}

input,
select {
  width: 100%;
  margin-top: 9px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #252c46;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: 0;
  border-radius: 14px;
  background: #5865f2;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:active {
  transform: scale(.97);
}

.admin {
  display: none;
}

.result {
  margin-top: 12px;
  text-align: center;
  color: #8affb0;
  font-weight: bold;
}

.small {
  color: #99a4c2;
  font-size: 13px;
  line-height: 1.5;
}

.history {
  margin-top: 15px;
  padding: 15px;
  background: #141a2c;
  border-radius: 18px;
}

.history-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.history-item {
  display: inline-block;
  margin: 4px;
  padding: 7px 10px;
  border-radius: 10px;
  background: #252c46;
  color: #9fb0ff;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🚀 Rocket</div>
    <div class="badge">DEMO MODE</div>
  </div>

  <div class="balance">
    Demo Balance<br>
    <span id="balance">1000 Points</span>
  </div>

  <div class="game">

    <div class="multiplier" id="multiplier">
      1.00x
    </div>

    <div class="rocket" id="rocket">
      🚀
    </div>

    <div class="flame" id="flame">
      🔥
    </div>

  </div>

  <div class="status" id="status">
    🚀 Starting...
  </div>

  <div class="panel">

    <b>🎮 Demo Points</b>

    <input
      id="amount"
      type="number"
      min="1"
      placeholder="Enter demo points"
    >

    <button onclick="joinRound()">
      🚀 JOIN CURRENT ROUND
    </button>

    <div class="result" id="result"></div>

  </div>

  <div class="history">

    <div class="history-title">
      📊 Recent Demo Rounds
    </div>

    <div id="history"></div>

  </div>

  <button onclick="toggleAdmin()">
    👑 Admin Demo Panel
  </button>

  <div class="panel admin" id="admin">

    <h2>👑 Admin Panel</h2>

    <div class="small">
      Demo-only controls.
      No real TON or money is used.
    </div>

    <label>
      Crash Mode
    </label>

    <select id="mode">
      <option value="random">
        Random 2x - 300x
      </option>

      <option value="fixed">
        Fixed Multiplier
      </option>
    </select>

    <label>
      Fixed Multiplier
    </label><input
      id="fixedCrash"
      type="number"
      min="2"
      max="300"
      value="20"
      placeholder="Example: 20"
    >

    <button onclick="saveAdminSettings()">
      💾 SAVE SETTINGS
    </button>

    <p id="adminStatus"></p>

  </div>

</div>

<script>

let balance = 1000;

let roundRunning = false;

let joinedAmount = 0;

let crashMode = "random";

let fixedCrash = 20;

let crashPoint = 10;

let multiplier = 1;

let startTime = 0;

let animationFrame = null;

const SPEED = 0.8;

const NEXT_ROUND_DELAY = 2500;


/* -------------------------
   BALANCE
------------------------- */

function updateBalance() {

  document.getElementById("balance")
    .innerText =
    Math.floor(balance) + " Points";
}


/* -------------------------
   RANDOM CRASH
------------------------- */

function randomCrash() {

  return Number(
    (2 + Math.random() * 298).toFixed(2)
  );
}


/* -------------------------
   GET CRASH POINT
------------------------- */

function getCrashPoint() {

  if (crashMode === "fixed") {

    return Math.max(
      2,
      Math.min(300, fixedCrash)
    );
  }

  return randomCrash();
}


/* -------------------------
   START ROUND
------------------------- */

function startRound() {

  if (roundRunning) {
    return;
  }

  roundRunning = true;

  multiplier = 1;

  crashPoint = getCrashPoint();

  startTime = performance.now();

  document.getElementById("status")
    .innerText =
    "🚀 Rocket is flying...";

  document.getElementById("result")
    .innerText = "";

  document.getElementById("rocket")
    .style.bottom = "35px";

  document.getElementById("flame")
    .style.bottom = "20px";

  animationFrame =
    requestAnimationFrame(updateRocket);
}


/* -------------------------
   ROCKET ANIMATION
------------------------- */

function updateRocket(now) {

  if (!roundRunning) {
    return;
  }

  const elapsed =
    (now - startTime) / 1000;

  /*
    Multiplier increases continuously.
  */

  multiplier =
    Math.exp(elapsed * SPEED);


  /*
    Crash reached
  */

  if (multiplier >= crashPoint) {

    multiplier = crashPoint;

    finishRound();

    return;
  }


  document.getElementById("multiplier")
    .innerText =
    multiplier.toFixed(2) + "x";


  /*
    Rocket movement
  */

  const progress =
    Math.min(
      1,
      (multiplier - 1) /
      Math.max(1, crashPoint - 1)
    );

  const rocketHeight =
    35 + progress * 270;


  document.getElementById("rocket")
    .style.bottom =
    rocketHeight + "px";


  document.getElementById("flame")
    .style.bottom =
    (rocketHeight - 18) + "px";


  animationFrame =
    requestAnimationFrame(updateRocket);
}


/* -------------------------
   FINISH ROUND
------------------------- */

function finishRound() {

  roundRunning = false;

  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;
  }


  document.getElementById("multiplier")
    .innerText =
    crashPoint.toFixed(2) + "x";


  document.getElementById("status")
    .innerText =
    "💥 Crashed at " +
    crashPoint.toFixed(2) +
    "x";


  /*
    DEMO RESULT ONLY
  */

  if (joinedAmount > 0) {

    const result =
      Math.floor(
        joinedAmount * crashPoint
      );

    balance += result;

    updateBalance();

    document.getElementById("result")
      .innerText =
      "🎉 Demo Result: +" +
      result +
      " Points";

    joinedAmount = 0;
  }


  addHistory(crashPoint);


  /*
    AUTO NEXT ROUND
  */

  setTimeout(function() {

    document.getElementById("multiplier")
      .innerText =
      "1.00x";

    document.getElementById("rocket")
      .style.bottom =
      "35px";

    document.getElementById("flame")
      .style.bottom =
      "20px";

    document.getElementById("status")
      .innerText =
      "🚀 Next round starting...";


    setTimeout(
      startRound,
      800
    );

  }, NEXT_ROUND_DELAY);
}


/* -------------------------
   JOIN ROUND
------------------------- */

function joinRound() {

  if (!roundRunning) {alert(
      "Wait for the next round."
    );

    return;
  }


  if (joinedAmount > 0) {

    alert(
      "You already joined this round."
    );

    return;
  }


  const amount =
    Number(
      document.getElementById("amount")
        .value
    );


  if (!amount || amount <= 0) {

    alert(
      "Enter Demo Points."
    );

    return;
  }


  if (amount > balance) {

    alert(
      "Not enough Demo Points."
    );

    return;
  }


  balance -= amount;

  joinedAmount = amount;

  updateBalance();


  document.getElementById("result")
    .innerText =
    "✅ Joined current demo round";
}


/* -------------------------
   HISTORY
------------------------- */

function addHistory(value) {

  const history =
    document.getElementById("history");

  const item =
    document.createElement("span");

  item.className =
    "history-item";

  item.innerText =
    value.toFixed(2) + "x";

  history.prepend(item);


  /*
    Keep only latest 8
  */

  while (
    history.children.length > 8
  ) {

    history.removeChild(
      history.lastChild
    );
  }
}


/* -------------------------
   ADMIN
------------------------- */

function toggleAdmin() {

  const panel =
    document.getElementById("admin");

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";
}


/* -------------------------
   SAVE ADMIN SETTINGS
------------------------- */

function saveAdminSettings() {

  const mode =
    document.getElementById("mode")
      .value;


  const value =
    Number(
      document.getElementById("fixedCrash")
        .value
    );


  crashMode = mode;


  if (mode === "fixed") {

    if (
      !value ||
      value < 2 ||
      value > 300
    ) {

      alert(
        "Fixed multiplier must be 2x - 300x."
      );

      return;
    }

    fixedCrash = value;
  }


  if (mode === "random") {

    document.getElementById("adminStatus")
      .innerText =
      "✅ Random 2x - 300x enabled.";

  } else {

    document.getElementById("adminStatus")
      .innerText =
      "✅ Fixed " +
      fixedCrash +
      "x enabled.";
  }
}


/* -------------------------
   START AUTOMATICALLY
------------------------- */

updateBalance();

setTimeout(
  startRound,
  1000
);

</script>

</body>
</html>
