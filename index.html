<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b16;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  width:92%;
  max-width:430px;
  margin:auto;
  padding:20px 0;
}

.header{
  font-size:27px;
  font-weight:900;
}

.balance{
  margin-top:15px;
  padding:15px;
  background:#141a2b;
  border-radius:18px;
  text-align:center;
}

.balance span{
  color:#55aaff;
  font-size:25px;
  font-weight:bold;
}

.game{
  position:relative;
  height:390px;
  margin-top:15px;
  overflow:hidden;
  border-radius:25px;
  background:
    radial-gradient(circle at 50% 45%,
    #30477d,
    #151d35 45%,
    #080b16 82%);
}

.multiplier{
  position:absolute;
  top:65px;
  width:100%;
  text-align:center;
  font-size:52px;
  font-weight:900;
}

.current{
  position:absolute;
  top:130px;
  width:100%;
  text-align:center;
  color:#8fb7ff;
  font-size:21px;
  font-weight:bold;
}

.rocket{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  font-size:68px;
}

.flame{
  position:absolute;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  font-size:30px;
}

.status{
  text-align:center;
  margin:12px;
  color:#aeb8d0;
}

.panel{
  margin-top:15px;
  padding:17px;
  background:#141a2b;
  border-radius:18px;
}

input{
  width:100%;
  margin-top:9px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#252c45;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.claim{
  background:#20a866;
}

.result{
  margin-top:12px;
  text-align:center;
  color:#8affb0;
  font-weight:bold;
}

.history{
  margin-top:15px;
  padding:15px;
  background:#141a2b;
  border-radius:18px;
}

.history span{
  display:inline-block;
  margin:4px;
  padding:7px 9px;
  background:#252c45;
  border-radius:9px;
  color:#9eafff;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    🚀 Rocket
  </div>

  <div class="balance">
    Balance<br>
    <span id="balance">1000 Points</span>
  </div>

  <div class="game">

    <div class="multiplier" id="multiplier">
      1.00x
    </div>

    <div class="current" id="current">
      0 Points
    </div>

    <div class="rocket" id="rocket">
      🚀
    </div>

    <div class="flame" id="flame">
      🔥
    </div>

  </div>

  <div class="status" id="status">
    🚀 Starting...
  </div>

  <div class="panel">

    <b>Points</b>

    <input
      id="amount"
      type="number"
      min="1"
      placeholder="Enter Points"
    >

    <button
      id="join"
      onclick="joinRound()">
      JOIN
    </button>

    <button
      id="claim"
      class="claim"
      onclick="claimReward()"
      disabled>
      CLAIM
    </button>

    <div
      class="result"
      id="result">
    </div>

  </div>

  <div class="history">
    <b>Recent Rounds</b>
    <div id="history"></div>
  </div>

</div>


<script>

let balance = 1000;

let running = false;
let joined = false;
let claimed = false;

let amount = 0;

let multiplier = 1;
let crashPoint = 10;

let startTime = 0;
let animation = null;


/* =========================
   RANDOM CRASH
========================= */

function getCrashPoint(){

  return Number(
    (2 + Math.random() * 298)
    .toFixed(2)
  );
}


/* =========================
   START ROUND
========================= */

function startRound(){

  running = true;

  joined = false;
  claimed = false;

  amount = 0;

  multiplier = 1;

  crashPoint =
    getCrashPoint();

  startTime =
    performance.now();

  document.getElementById("multiplier")
    .innerText = "1.00x";

  document.getElementById("current")
    .innerText = "0 Points";

  document.getElementById("status")
    .innerText =
    "🚀 Rocket is flying...";document.getElementById("result")
    .innerText = "";

  document.getElementById("join")
    .disabled = false;

  document.getElementById("claim")
    .disabled = true;

  document.getElementById("amount")
    .disabled = false;

  animation =
    requestAnimationFrame(updateRocket);
}


/* =========================
   AUTO ROCKET
========================= */

function updateRocket(now){

  if(!running){
    return;
  }

  const elapsed =
    (now - startTime) / 1000;


  /*
    Auto multiplier.

    Starts slowly.
    Gets faster as x increases.
  */

  multiplier =
    Math.exp(
      elapsed * 0.45
    );


  /* Crash */

  if(multiplier >= crashPoint){

    multiplier =
      crashPoint;

    crashRound();

    return;
  }


  /* Show multiplier */

  document.getElementById("multiplier")
    .innerText =
    multiplier.toFixed(2) + "x";


  /*
    If joined:
    10 Points

    1x = 10
    2x = 20
    3x = 30
    10x = 100
  */

  if(joined){

    const value =
      Math.floor(
        amount * multiplier
      );

    document.getElementById("current")
      .innerText =
      value + " Points";

  }else{

    document.getElementById("current")
      .innerText =
      "0 Points";
  }


  /*
    Rocket movement.

    Higher x = faster movement.
  */

  const progress =
    Math.min(
      1,
      (multiplier - 1) /
      Math.max(
        1,
        crashPoint - 1
      )
    );

  const height =
    35 + progress * 280;


  document.getElementById("rocket")
    .style.bottom =
    height + "px";


  document.getElementById("flame")
    .style.bottom =
    (height - 18) + "px";


  animation =
    requestAnimationFrame(
      updateRocket
    );
}


/* =========================
   JOIN
========================= */

function joinRound(){

  /*
    Rocket MUST already be running.
  */

  if(!running){

    return;
  }


  if(joined){

    alert(
      "Already joined this round."
    );

    return;
  }


  const value =
    Number(
      document.getElementById("amount")
        .value
    );


  if(!value || value <= 0){

    alert(
      "Enter Points."
    );

    return;
  }


  if(value > balance){

    alert(
      "Not enough Points."
    );

    return;
  }


  amount = value;

  balance -= amount;

  updateBalance();

  joined = true;


  /*
    Lock amount after joining.
  */

  document.getElementById("amount")
    .disabled = true;

  document.getElementById("join")
    .disabled = true;

  document.getElementById("claim")
    .disabled = false;

  document.getElementById("result")
    .innerText =
    "✅ Joined current round";
}


/* =========================
   CLAIM
========================= */

function claimReward(){

  if(
    !running ||
    !joined ||
    claimed
  ){

    return;
  }


  claimed = true;


  const reward =
    Math.floor(
      amount * multiplier
    );


  balance += reward;

  updateBalance();


  document.getElementById("claim")
    .disabled = true;


  document.getElementById("result")
    .innerText =
    "✅ Claimed " +
    reward +
    " Points at " +
    multiplier.toFixed(2) +
    "x";
}


/* =========================
   CRASH
========================= */

function crashRound(){

  running = false;

  if(animation){

    cancelAnimationFrame(
      animation
    );

    animation = null;
  }


  document.getElementById("multiplier")
    .innerText =
    crashPoint.toFixed(2) + "x";


  document.getElementById("status")
    .innerText =
    "💥 CRASH";


  document.getElementById("claim")
    .disabled = true;


  if(joined && !claimed){

    document.getElementById("result")
      .innerText =
      "💥 Crash! Round ended.";
  }


  addHistory(crashPoint);


  setTimeout(() => {

    document.getElementById("rocket")
      .style.bottom = "35px";

    document.getElementById("flame")
      .style.bottom = "15px";

    document.getElementById("amount")
      .disabled = false;

    document.getElementById("amount")
      .value = "";

    document.getElementById("status")
      .innerText =
      "🚀 Next round...";


    /*
      AUTO START
    */
